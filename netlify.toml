# New site (branch redesign/mind-at-work) lives in site/. Static export, no server.
[build]
  base = "site"
  command = "npm run build && npm run check"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# /plan and /about folded into the home page.
[[redirects]]
  from = "/plan/*"
  to = "/#work"
  status = 301

[[redirects]]
  from = "/about/*"
  to = "/#about"
  status = 301

[[redirects]]
  from = "/archive/*"
  to = "/#work"
  status = 301
